apiVersion: v1
kind: Namespace
metadata:
  name: elasticsearch
  labels:
    name: elasticsearch

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: elasticsearch
data:
  elasticsearch.yml: |
    cluster.name: "jaeger-elasticsearch"
    network.host: 0.0.0.0
    discovery.type: single-node
    xpack.security.enabled: false
    xpack.monitoring.enabled: false
    xpack.watcher.enabled: false
    xpack.ml.enabled: false

    # Performance settings
    indices.memory.index_buffer_size: 10%
    indices.memory.min_index_buffer_size: 48mb

    # Index management
    action.destructive_requires_name: true

    # Logging
    logger.level: INFO

  jvm.options: |
    -Xms1g
    -Xmx1g
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=4m
    -XX:MaxGCPauseMillis=50
    -Djava.io.tmpdir=${ES_TMPDIR}
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=data
    -XX:ErrorFile=logs/hs_err_pid%p.log

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elasticsearch
  labels:
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
      name: rest
    - port: 9300
      targetPort: 9300
      protocol: TCP
      name: inter-node
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-nodeport
  namespace: elasticsearch
  labels:
    app: elasticsearch
spec:
  type: NodePort
  ports:
    - port: 9200
      targetPort: 9200
      nodePort: 30200
      protocol: TCP
      name: rest
  selector:
    app: elasticsearch

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: elasticsearch
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: configure-sysctl
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            privileged: true
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
        - name: volume-mount-hack
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
          imagePullPolicy: Always
          command:
            ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
          imagePullPolicy: Always
          ports:
            - containerPort: 9200
              name: rest
              protocol: TCP
            - containerPort: 9300
              name: inter-node
              protocol: TCP
          resources:
            limits:
              memory: 2Gi
              cpu: 1000m
            requests:
              memory: 1Gi
              cpu: 500m
          env:
            - name: cluster.name
              value: jaeger-elasticsearch
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xmx1g -Xms1g"
            - name: network.host
              value: 0.0.0.0
            - name: transport.host
              value: localhost
            - name: http.port
              value: "9200"
            - name: discovery.zen.minimum_master_nodes
              value: "1"
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.monitoring.enabled
              value: "false"
            - name: xpack.watcher.enabled
              value: "false"
            - name: xpack.ml.enabled
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: config
              mountPath: /usr/share/elasticsearch/config/jvm.options
              subPath: jvm.options
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: elasticsearch-config
      nodeSelector:
        node-type: worker
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: elasticsearch
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# Index template for Jaeger traces
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-setup
  namespace: elasticsearch
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-elasticsearch
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -f http://elasticsearch:9200/_cluster/health; do
                echo "Waiting for Elasticsearch..."
                sleep 10
              done
              echo "Elasticsearch is ready!"
      containers:
        - name: setup
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Setting up Elasticsearch for Jaeger..."

              # Create index template for jaeger spans
              curl -X PUT "elasticsearch:9200/_index_template/jaeger-spans" \
                -H 'Content-Type: application/json' \
                -d '{
                  "index_patterns": ["jaeger-span-*"],
                  "template": {
                    "settings": {
                      "number_of_shards": 1,
                      "number_of_replicas": 0,
                      "index.refresh_interval": "1s",
                      "index.number_of_routing_shards": 1
                    },
                    "mappings": {
                      "properties": {
                        "traceID": {
                          "type": "keyword"
                        },
                        "spanID": {
                          "type": "keyword"
                        },
                        "operationName": {
                          "type": "keyword"
                        },
                        "startTime": {
                          "type": "long"
                        },
                        "duration": {
                          "type": "long"
                        },
                        "tags": {
                          "type": "nested",
                          "properties": {
                            "key": {"type": "keyword"},
                            "value": {"type": "text"},
                            "type": {"type": "keyword"}
                          }
                        },
                        "process": {
                          "properties": {
                            "serviceName": {
                              "type": "keyword"
                            },
                            "tags": {
                              "type": "nested"
                            }
                          }
                        }
                      }
                    }
                  }
                }'

              # Create index template for jaeger services
              curl -X PUT "elasticsearch:9200/_index_template/jaeger-services" \
                -H 'Content-Type: application/json' \
                -d '{
                  "index_patterns": ["jaeger-service-*"],
                  "template": {
                    "settings": {
                      "number_of_shards": 1,
                      "number_of_replicas": 0,
                      "index.refresh_interval": "1s"
                    },
                    "mappings": {
                      "properties": {
                        "serviceName": {
                          "type": "keyword"
                        },
                        "operationName": {
                          "type": "keyword"
                        }
                      }
                    }
                  }
                }'

              echo "Elasticsearch setup completed!"

---
# Optional: Curator for index management
apiVersion: v1
kind: ConfigMap
metadata:
  name: curator-config
  namespace: elasticsearch
data:
  config.yml: |
    client:
      hosts:
        - elasticsearch
      port: 9200
      url_prefix:
      use_ssl: False
      certificate:
      client_cert:
      client_key:
      ssl_no_validate: False
      http_auth:
      timeout: 30
      master_only: False

    logging:
      loglevel: INFO
      logfile:
      logformat: default
      blacklist: ['elasticsearch', 'urllib3']

  action.yml: |
    actions:
      1:
        action: delete_indices
        description: "Delete jaeger indices older than 7 days"
        options:
          ignore_empty_list: True
          disable_action: False
        filters:
        - filtertype: pattern
          kind: prefix
          value: jaeger-
        - filtertype: age
          source: name
          direction: older
          timestring: '%Y-%m-%d'
          unit: days
          unit_count: 7

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: curator
  namespace: elasticsearch
spec:
  schedule: "0 1 * * *" # Daily at 1 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curator
              image: untergeek/curator:8.0.4
              args:
                - --config
                - /etc/curator/config.yml
                - /etc/curator/action.yml
              volumeMounts:
                - name: config
                  mountPath: /etc/curator
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          volumes:
            - name: config
              configMap:
                name: curator-config
          nodeSelector:
            node-type: worker
