---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-v2-config
  namespace: observability
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        logs:
          level: info
        metrics:
          level: detailed

    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133

      jaeger_query:
        storage:
          traces: elasticsearch_trace_storage
          metrics: elasticsearch_trace_storage
        ui:
          config_file: /etc/jaeger/ui-config.json

      jaeger_storage:
        backends:
          elasticsearch_trace_storage: &elasticsearch_config
            elasticsearch:
              server_urls:
                - http://elasticsearch.elasticsearch.svc.cluster.local:9200
        metric_backends:
          elasticsearch_trace_storage: *elasticsearch_config

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      zipkin:
        endpoint: 0.0.0.0:9411

    processors:
      batch: {}

    exporters:
      jaeger_storage_exporter:
        trace_storage: elasticsearch_trace_storage

  ui-config.json: |
    {
      "monitor": {
        "menuEnabled": true
      }
    }

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger-v2
  namespace: observability

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-v2
  namespace: observability
  labels:
    app: jaeger-v2
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger-v2
  template:
    metadata:
      labels:
        app: jaeger-v2
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: all-in-one
    spec:
      serviceAccountName: jaeger-v2
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.13.0
          args:
            - "--config=/etc/jaeger/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: jaeger-grpc
              containerPort: 14250
              protocol: TCP
            - name: jaeger-http
              containerPort: 14268
              protocol: TCP
            - name: zipkin
              containerPort: 9411
              protocol: TCP
            - name: query
              containerPort: 16686
              protocol: TCP
            - name: admin
              containerPort: 14269
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: healthcheck
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: jaeger-v2-config

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-v2-query
  namespace: observability
  labels:
    app: jaeger-v2
    component: query
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      protocol: TCP
  selector:
    app: jaeger-v2

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-v2-collector
  namespace: observability
  labels:
    app: jaeger-v2
    component: collector
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
    - name: jaeger-http
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP
  selector:
    app: jaeger-v2

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-v2-admin
  namespace: observability
  labels:
    app: jaeger-v2
    component: admin
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: 14269
      targetPort: 14269
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
  selector:
    app: jaeger-v2

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-v2-query-nodeport
  namespace: observability
spec:
  type: NodePort
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      nodePort: 30686
  selector:
    app: jaeger-v2

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-v2-collector-nodeport
  namespace: observability
spec:
  type: NodePort
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318
  selector:
    app: jaeger-v2
